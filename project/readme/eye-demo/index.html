<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursor Eye</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage">
    <section class="eye-card" aria-label="Animated left eye">
      <span class="eyebrow">Cursor study 01</span>
      <div class="eye" id="leftEye" aria-hidden="true">
        <div class="iris">
          <div class="pupil"></div>
          <span class="highlight"></span>
        </div>
      </div>
      <p class="instruction">Move your cursor around the page</p>
      <span class="status"><i></i> Tracking left eye</span>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
